name: collect

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[collect]"
      - run: python -m radar collect
      - name: Commit and push data/raw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No new items."
            exit 0
          fi
          git commit -m "collect: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
